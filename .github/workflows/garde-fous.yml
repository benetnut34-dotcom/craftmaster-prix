name: Garde-fous

# Verifie, a chaque pull request et a chaque changement de main, que le pipeline des prix
# garde ses choix (PvP seul, 14 jours, relais automatique) et le format que lit l'addon.
# N'utilise aucun secret.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/test_fetch.py

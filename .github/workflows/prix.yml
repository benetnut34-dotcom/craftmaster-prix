name: Prix de l'HV (API Blizzard)

# Tourne sur les serveurs de GitHub : aucun PC n'a besoin d'etre allume.
#
# Le declencheur "schedule" de GitHub est "au mieux" : sur ce depot il n'a lance
# qu'un passage sur une trentaine prevus. Le workflow se relance donc LUI-MEME :
# le job "relais" attend la prochaine h32 puis relance le workflow (un
# workflow_dispatch lance avec le jeton du workflow est autorise, contrairement
# aux autres evenements). Le cron ci-dessous ne sert plus que de filet : s'il
# finit par tourner alors que la chaine est cassee, il la relance.
# Blizzard ne publie qu'une photo par heure (vers la 21e minute) ; un passage
# sans photo nouvelle ne publie rien.
on:
  schedule:
    - cron: '12,32,52 * * * *'
  workflow_dispatch:        # bouton "Run workflow"
  push:                     # un changement du script ou du workflow relance la chaine
    branches: [main]
    paths: ['fetch.py', '.github/workflows/prix.yml']

permissions:
  contents: write
  actions: write            # relais + keep-alive

jobs:
  prix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: prix
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Etat precedent (branche data)
        run: |
          mkdir -p out
          if git fetch --depth 1 origin data 2>/dev/null; then
            git --work-tree=out checkout origin/data -- . 2>/dev/null || true
            git reset -q
          fi
          ls -la out

      - name: Telecharger les hotels des ventes
        id: fetch
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          REGION: eu
          RULESETS: PvP          # serveur JcJ uniquement
          KEEP_DAYS: 14          # fenetre glissante ; au-dela, tout est purge
        run: python3 fetch.py

      - name: Publier sur la branche data (sans historique git)
        if: steps.fetch.outputs.changed == '1'
        run: |
          cd out
          git init -q -b data
          git config user.name "craftmaster-prix"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -q -m "Prix du $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      - name: Resume
        if: always()
        run: |
          {
            echo "### Prix de l'HV"
            echo "- Publication : ${{ steps.fetch.outputs.changed == '1' && 'oui (photo nouvelle)' || 'non (rien de nouveau ou erreur)' }}"
            ls -l out | awk 'NR>1 {printf "- %s : %d Ko\n", $9, $5/1024}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep-alive (GitHub coupe les planifications des depots inactifs apres 60 jours)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable prix.yml --repo "${{ github.repository }}" || true

  # Attend la prochaine h32 (UTC) puis relance le workflow. Meme si le passage
  # a echoue (always) : la chaine ne doit jamais s'arreter. Un seul relais vit a
  # la fois : un relais plus recent (cron, clic manuel) annule l'ancien.
  relais:
    needs: prix
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: relais
      cancel-in-progress: true
    steps:
      - name: Attendre la prochaine h32 puis relancer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date +%s)
          next=$(date -u -d "$(date -u +%Y-%m-%d\ %H):32:00" +%s)
          if [ "$next" -le "$((now + 600))" ]; then next=$((next + 3600)); fi
          echo "Prochain passage dans $(( (next - now) / 60 )) min"
          sleep $((next - now))
          gh workflow run prix.yml --repo "${{ github.repository }}"

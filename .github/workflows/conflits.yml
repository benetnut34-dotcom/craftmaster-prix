name: Alerte conflits

# Quand une pull request est en conflit avec main (parce que main a avance depuis qu'elle
# a ete ecrite), l'auteur et le proprietaire sont prevenus par un commentaire avec une
# mention, et la PR recoit l'etiquette "conflit". GitHub ne lance pas les workflows d'une
# PR deja en conflit : c'est pourquoi on re-verifie TOUTES les PR ouvertes a chaque
# changement de main, et quand une PR est ouverte ou mise a jour.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  conflits:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- conflit-craftmaster -->';
            const owner = 'benetnut34-dotcom';
            const label = 'conflit';
            try { await github.rest.issues.getLabel({ ...context.repo, name: label }); }
            catch (e) { await github.rest.issues.createLabel({ ...context.repo, name: label, color: 'd93f0b', description: 'Conflit avec main : a rebaser' }); }

            const prs = await github.paginate(github.rest.pulls.list, { ...context.repo, state: 'open', base: 'main' });
            core.info(`${prs.length} pull request(s) ouverte(s)`);
            const sleep = ms => new Promise(r => setTimeout(r, ms));
            let broken = [];
            for (const p of prs) {
              // GitHub calcule "mergeable" a part : null = pas encore calcule
              let pr;
              for (let i = 0; i < 8; i++) {
                pr = (await github.rest.pulls.get({ ...context.repo, pull_number: p.number })).data;
                if (pr.mergeable !== null) break;
                await sleep(4000);
              }
              const dirty = pr.mergeable === false || pr.mergeable_state === 'dirty';
              const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: p.number });
              const mine = comments.find(c => c.body && c.body.includes(marker));
              if (dirty) {
                broken.push(p.number);
                const body = `${marker}\n` +
                  `⚠️ **Conflit avec \`main\`** : @${p.user.login} (cc @${owner})\n\n` +
                  `\`main\` a avancé depuis que cette branche a été écrite et les deux modifient les mêmes lignes. ` +
                  `**Ne pas écraser \`main\`** (jamais de \`push --force\` dessus) : ramène \`main\` dans ta branche et résous les conflits en gardant les deux changements quand c'est possible :\n\n` +
                  '```\ngit fetch origin\ngit rebase origin/main     # ou : git merge origin/main\n# résoudre les fichiers marqués, puis :\ngit push --force-with-lease origin ' + pr.head.ref + '\n```\n' +
                  `Si tu hésites sur un conflit dans \`fetch.py\` ou \`prix.yml\`, demande au propriétaire : ce sont les fichiers qui font tourner la collecte des prix.`;
                if (mine) {
                  if (!mine.body.includes('Conflit avec')) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
                } else {
                  await github.rest.issues.createComment({ ...context.repo, issue_number: p.number, body });
                }
                await github.rest.issues.addLabels({ ...context.repo, issue_number: p.number, labels: [label] });
              } else {
                if (mine && mine.body.includes('Conflit avec')) {
                  await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body: `${marker}\n✅ Plus de conflit avec \`main\`.` });
                }
                try { await github.rest.issues.removeLabel({ ...context.repo, issue_number: p.number, name: label }); } catch (e) { /* pas d'etiquette */ }
              }
            }
            if (broken.length) core.warning(`Pull request(s) en conflit : ${broken.map(n => '#' + n).join(', ')}`);
            // la verification de la PR en cours echoue si CETTE PR est en conflit
            if (context.eventName === 'pull_request' && broken.includes(context.payload.pull_request.number)) {
              core.setFailed('Cette pull request est en conflit avec main : voir le commentaire.');
            }
